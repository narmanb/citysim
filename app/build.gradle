plugins {
    id 'com.android.application'
}

android {
    namespace 'com.narmanb.metroforge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.narmanb.metroforge'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.2.2-isometric'
        manifestPlaceholders = [appLabel: 'MetroForge']
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix '.isometricpreview'
            versionNameSuffix '-preview'
            manifestPlaceholders = [appLabel: 'MetroForge Isometric']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
