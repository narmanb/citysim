<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MetroForge — isometric asset proof</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#182c3b;color:#eef4df;font:14px system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}aside{position:absolute;left:18px;top:18px;padding:14px 18px;background:#142530e8;border:1px solid #688384;border-radius:6px;max-width:320px}h1{font-size:18px;margin:0 0 8px}p{line-height:1.5;margin:8px 0}a{color:#f3d47e}button{background:#37545d;color:white;border:1px solid #7d9f9f;padding:8px 14px;border-radius:4px;margin-right:4px}</style>
</head><body><canvas id="proof"></canvas><aside><h1>MetroForge isometric asset proof</h1><p>Grass, water, streets, junctions, houses, a medium building and trees on one 132×66 grid.</p><p>Drag to pan. Scroll or use buttons to zoom. This scene tests the art; the game runs at the link below.</p><button id="minus" aria-label="Zoom out">−</button><button id="plus" aria-label="Zoom in">+</button><p><a href="MetroForge-2000.html">Open MetroForge 2000</a></p><span id="status">Loading supplied CC0 artwork…</span></aside>
<script src="assets/manifest.js"></script><script src="src/isometric-core.js"></script><script src="src/isometric-art.js"></script>
<script>
'use strict';
const canvas=document.getElementById('proof'),view={ctx:canvas.getContext('2d'),scale:54,cx:0,cy:0,w:0,h:0};
const tiles=Array.from({length:144},()=>({road:false}));
for(let x=2;x<10;x++)tiles[6*12+x].road=true;
for(let y=2;y<10;y++)tiles[y*12+6].road=true;
for(let x=2;x<=6;x++)tiles[2*12+x].road=true;
for(let y=2;y<=6;y++)tiles[y*12+2].road=true;
const art=new MetroForgeIsoArt(view,draw);window.MetroForgePreview={view,art,ready:false};
function resize(){const dpr=Math.min(2,devicePixelRatio||1);view.w=innerWidth;view.h=innerHeight;canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;view.ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function draw(){if(!window.MetroForgePreview)return;const c=view.ctx;c.fillStyle='#182c3b';c.fillRect(0,0,view.w,view.h);
 for(let sum=0;sum<23;sum++)for(let x=0;x<12;x++){const y=sum-x;if(y<0||y>=12)continue;art.terrain(x>9?'water':'grass',x,y);if(tiles[y*12+x].road)art.road(x,y,0,MetroForgeIsoCore.roadMask(tiles,y*12+x,12));}
 art.building(4.5,4.5,0,'house',1);art.building(7.5,4.5,0,'house',2);art.building(7.5,7.5,0,'office',3);
 for(const [x,y]of [[3.5,7.5],[4.5,8.5],[8.5,3.5],[8.5,8.5]])art.tree(x,y);
}
view.cx=innerWidth*.57;view.cy=innerHeight*.48-6*view.scale;resize();window.addEventListener('resize',resize);
art.loaded.then(()=>{MetroForgePreview.ready=true;document.getElementById('status').textContent=art.errors.length?'Artwork unavailable; showing fallback shapes.':'Five atlases loaded · all supplied licenses preserved';draw();});
let last=null;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);last={x:e.clientX,y:e.clientY};});canvas.addEventListener('pointermove',e=>{if(!last)return;view.cx+=e.clientX-last.x;view.cy+=e.clientY-last.y;last={x:e.clientX,y:e.clientY};draw();});for(const event of ['pointerup','pointercancel'])canvas.addEventListener(event,()=>last=null);
function zoom(f,x=view.w/2,y=view.h/2){MetroForgeIsoCore.zoomCamera(view,f,x,y);draw();}canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY);},{passive:false});document.getElementById('plus').onclick=()=>zoom(1.2);document.getElementById('minus').onclick=()=>zoom(1/1.2);
</script></body></html>
