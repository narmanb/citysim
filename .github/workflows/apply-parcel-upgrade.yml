name: Apply MetroForge parcel upgrade

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_parcel_upgrade.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply parcel-development patch
        run: python tools/apply_parcel_upgrade.py
      - name: Check embedded JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('MetroForge-2000.html').read_text()
          start = text.index('<script>') + len('<script>')
          end = text.rindex('</script>')
          Path('/tmp/metroforge.js').write_text(text[start:end])
          PY
          node --check /tmp/metroforge.js
      - name: Commit upgraded game
        shell: bash
        run: |
          if git diff --quiet -- MetroForge-2000.html; then
            echo 'No game changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MetroForge-2000.html
          git commit -m 'Add parcel-based residential development'
          git push
