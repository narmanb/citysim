name: Build native Godot Android preview

on:
  workflow_dispatch:
  push:
    branches: [feature/godot-migration]
    paths:
      - 'godot/**'
      - '.github/workflows/build-godot-android.yml'

permissions:
  contents: write

concurrency:
  group: godot-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: '4.6.3'
    steps:
      - name: Check out migration source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install verified official Godot and Android templates
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          RELEASE_URL="https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable"
          curl --fail --location --retry 3 "$RELEASE_URL/Godot_v4.6.3-stable_linux.x86_64.zip" -o Godot_v4.6.3-stable_linux.x86_64.zip
          curl --fail --location --retry 3 "$RELEASE_URL/Godot_v4.6.3-stable_export_templates.tpz" -o Godot_v4.6.3-stable_export_templates.tpz
          curl --fail --location --retry 3 "$RELEASE_URL/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          sha512sum --check --ignore-missing SHA512-SUMS.txt
          unzip -q Godot_v4.6.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
          python - <<'PY'
          from pathlib import Path
          import shutil
          from zipfile import ZipFile
          target = Path.home() / '.local/share/godot/export_templates/4.6.3.stable'
          target.mkdir(parents=True, exist_ok=True)
          with ZipFile('Godot_v4.6.3-stable_export_templates.tpz') as archive:
              for name in ('android_debug.apk', 'android_release.apk', 'version.txt'):
                  with archive.open('templates/' + name) as source, (target / name).open('wb') as output:
                      shutil.copyfileobj(source, output)
          PY

      - name: Configure Godot Android test signing
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.GODOT_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          key = Path(os.environ['RUNNER_TEMP']) / 'godot-debug.keystore'
          encoded = os.environ.get('DEBUG_KEYSTORE_BASE64', '')
          if encoded:
              key.write_bytes(base64.b64decode(encoded, validate=True))
          else:
              subprocess.run(['keytool', '-genkeypair', '-keystore', str(key),
                              '-storepass', 'android', '-keypass', 'android',
                              '-alias', 'androiddebugkey', '-keyalg', 'RSA',
                              '-keysize', '2048', '-validity', '10000',
                              '-dname', 'CN=Android Debug,O=Android,C=US'], check=True)
          settings = Path.home() / '.config/godot/editor_settings-4.6.tres'
          settings.parent.mkdir(parents=True, exist_ok=True)
          values = {
              'export/android/android_sdk_path': os.environ['ANDROID_HOME'],
              'export/android/java_sdk_path': os.environ['JAVA_HOME'],
              'export/android/debug_keystore': str(key),
              'export/android/debug_keystore_user': 'androiddebugkey',
              'export/android/debug_keystore_pass': 'android',
          }
          settings.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' +
                              '\n'.join(name + ' = ' + json.dumps(value)
                                        for name, value in values.items()) + '\n')
          PY
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/godot-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Verify native simulation, saves, controls and source art
        run: python godot/tools/check_project.py --godot "$GODOT_BIN"

      - name: Export and verify native Android APK
        run: |
          python godot/tools/build_android.py --godot "$GODOT_BIN" --output dist/MetroForge-Godot-0.3.13-Terrain-Civil-Water.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/MetroForge-Godot-0.3.13-Terrain-Civil-Water.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 dist/MetroForge-Godot-0.3.13-Terrain-Civil-Water.apk
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          from zipfile import ZipFile, ZIP_DEFLATED
          source = Path('dist/MetroForge-Godot-Source.zip')
          tracked = subprocess.check_output(['git', 'ls-files', '-z', 'godot/']).decode().split('\0')
          with ZipFile(source, 'w', ZIP_DEFLATED) as archive:
              for name in filter(None, tracked):
                  archive.write(name, 'MetroForge-Godot/' + name.removeprefix('godot/'))
          with ZipFile(source) as archive:
              assert archive.testzip() is None
          assets = sorted(Path('dist').glob('*.apk')) + [source]
          Path('dist/MetroForge-Godot-SHA256SUMS.txt').write_text(
              ''.join(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n'
                      for path in assets))
          PY

      - name: Upload GitHub Actions download
        uses: actions/upload-artifact@v4
        with:
          name: MetroForge-Godot-Android
          path: |
            dist/*.apk
            dist/*.zip
            dist/MetroForge-Godot-SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Attach terrain test to its separate draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.3.13-terraform-preview --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/godot-draft.json"; then
            gh release create v0.3.13-terraform-preview --repo "$GITHUB_REPOSITORY" --draft --prerelease --target "$GITHUB_SHA" \
              --title "MetroForge Godot 0.3.13 — Sloped Roads, Foundations and Shores" \
              --notes "Gentle directional slopes now support roads that follow the grade and upright buildings on level foundations with retaining walls. Steeper and Rounded land still requires Flatten. Shallow road joins, cars, picking, overlays and Undo/Redo use shared construction geometry. Water draws above negative channel beds; shore bands respect bank height, and natural grass/desert edges blend. Channel connectivity and flooding rules are unchanged. Save format12 imports valid versions6-11; older APKs cannot read the new slope construction. Both landscape directions remain supported. Export your city before installing: signing setup remains deferred and the temporary test key can require reinstall. Previous APKs remain available."
            gh release view v0.3.13-terraform-preview --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/godot-draft.json"
          fi
          python -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"] + "/godot-draft.json"))["isDraft"], "Only an unpublished draft may receive test artifacts"'
          gh release upload v0.3.13-terraform-preview dist/*.apk dist/*.zip dist/MetroForge-Godot-SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
# Terrain-test packaging; previous preview downloads remain untouched.
