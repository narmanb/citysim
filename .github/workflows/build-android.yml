name: Build MetroForge Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'MetroForge-2000.html'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses and install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Package current MetroForge game into app assets
        run: |
          mkdir -p app/src/main/assets
          cp MetroForge-2000.html app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MetroForge-Android-debug.apk
          sha256sum MetroForge-Android-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetroForge-Android-APK
          path: MetroForge-Android-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
